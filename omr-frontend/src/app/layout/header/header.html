<div class="header">

  <div class="header-left">
    <button class="hamburger-btn" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <img src="assets/images/menu.png" alt="menu" class="menu-icon">
    </button>

    <h3 *ngIf="userLoaded">Welcome {{ user?.username }}</h3>

    <h3 *ngIf="!userLoaded" class="user-placeholder">
      &nbsp;
    </h3>
  </div>

  <div class="profile-wrapper">

    <button type="button" class="profile-btn" (click)="toggleProfilePopup()">
      <img src="assets/images/profile.png" alt="profile" />
    </button>

    <div class="profile-popup" *ngIf="showProfilePopup">

      <div class="profile-top">
        <img src="assets/images/profile.png" alt="profile" />

        <div class="user-details">
          <h4>{{ user?.username }}</h4>
          <p>{{ user?.role }}</p>
        </div>
      </div>

      <div class="email">
        {{ user?.email }}
      </div>

      <button class="logout-btn" (click)="logout()">
        Logout
      </button>

    </div>
  </div>
</div>
