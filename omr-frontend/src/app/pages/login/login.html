<div class="login-page">
  <div class="login-card">

    <h1 class="title">OMR Analyzer</h1>
    <p class="subtitle">Sign in to Continue</p>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="login()" novalidate>

      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <img src="/assets/images/email.png" alt="email" class="email-icon" />
          </span>
          <input type="email" placeholder="Enter email" [(ngModel)]="email" name="email" required autocomplete="email"
            [class.input-error]="errorMessage" />
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <img src="/assets/images/padlock.png" alt="password" class="password-icon" />
          </span>
          <input [type]="showPassword ? 'text' : 'password'" placeholder="Enter password" [(ngModel)]="password"
            name="password" required autocomplete="current-password" [class.input-error]="errorMessage" />
          <button class="eye-btn" type="button" (click)="showPassword = !showPassword">
            <img [src]="showPassword ? 'assets/images/eye-off.png' : 'assets/images/eye.png'" alt="toggle" />
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading" class="spinner-wrap">
          <span class="spinner"></span> Logging in...
        </span>
      </button>

    </form>
  </div>
</div>
